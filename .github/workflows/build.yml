name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Read mod version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tierednetworks-${{ steps.ver.outputs.version }}
          path: build/libs/tierednetworks-${{ steps.ver.outputs.version }}.jar

      - name: Release (only when the version tag doesn't exist yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
          else
            gh release create "$TAG" "build/libs/tierednetworks-${{ steps.ver.outputs.version }}.jar" \
              --title "Tiered Networks ${{ steps.ver.outputs.version }}" \
              --notes "Automated build of Tiered Networks ${{ steps.ver.outputs.version }} for Forge 1.20.1."
          fi
